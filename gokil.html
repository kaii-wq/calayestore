<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Dashboard Pro - Calaye Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f9; --card:#ffffff; --ink:#1e293b; --mute:#64748b;
  --acc:#8b5cf6; --acc-glow:rgba(139,92,246,0.2); --line:#e2e8f0;
  --ok:#10b981; --bad:#ef4444; --warn:#f59e0b;
  --shadow:0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
}
*{box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:20px;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:16px 24px;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:20px}
h1{margin:0;font-size:20px;font-weight:800;color:var(--acc)}
h1 small{display:block;font-size:12px;color:var(--mute);font-weight:500}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:768px){.grid-4{grid-template-columns:repeat(2,1fr)}}

.stat-card{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:18px;box-shadow:var(--shadow)}
.stat-card .val{font-size:22px;font-weight:800;margin-top:6px;color:var(--ink)}
.stat-card .val.ok{color:var(--ok)}

.nav-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mute);transition:all .2s}
.tab-btn.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 14px var(--acc-glow)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

button,input,select{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.btn{background:var(--acc);color:#fff;border:none;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn.del{background:rgba(239,68,68,0.1);color:var(--bad)}
.btn.del:hover{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn)}

.badge{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge.PENDING,.badge.Menunggu{background:rgba(245,158,11,0.15);color:var(--warn)}
.badge.SUCCESS,.badge.Selesai{background:rgba(16,185,129,0.15);color:var(--ok)}
.badge.Dibatalkan{background:rgba(239,68,68,0.15);color:var(--bad)}

.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--bg);color:var(--mute);font-size:12px;text-transform:uppercase}

.toast{
  position:fixed;top:20px;right:20px;background:#1e293b;color:#fff;
  padding:14px 20px;border-radius:16px;font-size:13px;font-weight:600;z-index:999;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:slideIn .3s ease;
}
@keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

.sp{margin-top:14px}
.low-stock{background:rgba(239,68,68,0.03);border-left:4px solid var(--bad)}
.prod-img-preview{width:45px;height:45px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>👑 Calaye Admin Pro</h1>
      <small>🟢 Firebase Real-Time Aktif</small>
    </div>
    <div class="row">
      <button class="btn warn sm" onclick="window.testBeep()">🔔 Tes Beep</button>
      <button class="btn ok sm" onclick="window.exportData()">📥 Backup JSON</button>
      <button class="btn sm" onclick="document.getElementById('impFile').click()">📤 Restore</button>
      <input type="file" id="impFile" style="display:none" accept=".json" onchange="window.importData(event)">
    </div>
  </header>

  <!-- Financial Statistics -->
  <div class="grid-4">
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Total Omset</div>
      <div class="val ok" id="st-rev">Rp0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Estimasi Profit</div>
      <div class="val" id="st-profit" style="color:var(--acc)">Rp0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Total Pesanan</div>
      <div class="val" id="st-orders">0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Stok Menipis (&lt;3)</div>
      <div class="val" id="st-low" style="color:var(--bad)">0 Item</div>
    </div>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn on" onclick="window.setTab('orders',this)">📑 Pesanan Live</button>
    <button class="tab-btn" onclick="window.setTab('products',this)">📦 Stok & Gambar</button>
    <button class="tab-btn" onclick="window.setTab('coupons',this)">🎟️ Kupon Diskon</button>
    <button class="tab-btn" onclick="window.setTab('settings',this)">⚙️ Pengaturan</button>
  </div>

  <main id="app"></main>
</div>
<div id="toast-container"></div>

<!-- Firebase & Logic Script -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAk3iZuyjIrexLN1UQ-HMW2CuwoOG2Ivhw",
  authDomain: "calayestore.firebaseapp.com",
  projectId: "calayestore",
  storageBucket: "calayestore.appspot.com",
  messagingSenderId: "1053043880481",
  appId: "1:1053043880481:web:bb5886b0ac92ec5338e960"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const DB_KEY = 'calaye_store_db_v5';
const seedData = () => ({
  settings: { name: 'Calaye Store', wa: '6281234567890' },
  coupons: [
    { code: 'CALAYE20', type: 'percent', val: 10 },
    { code: 'HEMAT5K', type: 'fixed', val: 5000 }
  ],
  orders: [],
  products: [
    {
      id: 'p1', name: 'Canva Pro', cat: 'Desain', img: 'https://i.imgur.com/7k123ab.png', status: 'tersedia',
      variants: [
        { id: 'v1', label: '1 Bulan', price: 10000, cost: 4000, stock: 10 },
        { id: 'v2', label: '1 Tahun', price: 60000, cost: 20000, stock: 4 }
      ]
    }
  ]
});

let DB;
function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) DB = JSON.parse(raw);
  } catch(e) {}
  if (!DB || !Array.isArray(DB.products)) {
    DB = seedData();
    saveToStorage();
  }
}
loadDB();

let currentTab = 'orders';
let liveOrders = [];
let knownOrderIds = new Set();
let isFirstLoad = true;

function saveToStorage() {
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}

function save() {
  saveToStorage();
  updateStats();
  renderTab();
}

function rp(n) { return 'Rp' + Number(n || 0).toLocaleString('id-ID'); }

function showToast(msg) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'toast';
  div.textContent = msg;
  container.appendChild(div);
  setTimeout(() => div.remove(), 4000);
}

window.playNotificationSound = function() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
};

window.testBeep = function() {
  window.playNotificationSound();
  showToast('🔔 Suara beep aktif!');
};

onSnapshot(collection(db, "orders"), (snapshot) => {
  let orders = [];
  let newOrderDetected = false;

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const id = docSnap.id;
    orders.push({ id, ...data });

    if (!knownOrderIds.has(id)) {
      knownOrderIds.add(id);
      if (!isFirstLoad) newOrderDetected = true;
    }
  });

  if (newOrderDetected) {
    window.playNotificationSound();
    showToast('🔔 Pesanan baru masuk!');
  }
  isFirstLoad = false;

  orders.sort((a, b) => new Date(b.createdAt || b.date || 0) - new Date(a.createdAt || a.date || 0));
  liveOrders = orders;
  DB.orders = orders;

  updateStats();
  renderTab();
});

function updateStats() {
  loadDB();
  const completed = liveOrders.filter(o => o.status === 'SUCCESS' || o.status === 'Selesai');
  const rev = completed.reduce((a, b) => a + (b.price || b.total || 0), 0);
  
  let profit = 0;
  completed.forEach(o => {
    (o.items || []).forEach(item => {
      const prod = (DB.products || []).find(p => p.id === item.pid || p.name === item.name);
      if (prod && prod.variants) {
        const v = prod.variants.find(x => x.label === item.label || x.id === item.vid);
        if (v && v.cost !== undefined) {
          profit += ((item.price || v.price) - v.cost) * (item.qty || 1);
        } else {
          profit += (item.price || 0) * 0.5 * (item.qty || 1);
        }
      }
    });
  });

  let lowStockCount = 0;
  (DB.products || []).forEach(p => {
    (p.variants || []).forEach(v => { if ((v.stock || 0) < 3) lowStockCount++; });
  });

  if (document.getElementById('st-rev')) document.getElementById('st-rev').textContent = rp(rev);
  if (document.getElementById('st-profit')) document.getElementById('st-profit').textContent = rp(profit);
  if (document.getElementById('st-orders')) document.getElementById('st-orders').textContent = liveOrders.length;
  if (document.getElementById('st-low')) document.getElementById('st-low').textContent = lowStockCount + ' Item';
}

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  if (el) el.classList.add('on');
  renderTab();
}
window.setTab = setTab;

function renderTab() {
  loadDB();
  const app = document.getElementById('app');
  if (!app) return;
  if (currentTab === 'orders') renderOrders(app);
  else if (currentTab === 'products') renderProducts(app);
  else if (currentTab === 'coupons') renderCoupons(app);
  else if (currentTab === 'settings') renderSettings(app);
}

function renderOrders(el) {
  const orders = liveOrders;
  if (!orders.length) {
    el.innerHTML = `<div class="card" style="text-align:center; color:var(--mute);">Belum ada pesanan masuk.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="card">
      <h3>Daftar Pesanan Masuk</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Kode / Waktu</th>
              <th>Pemesan</th>
              <th>Produk</th>
              <th>Total</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${orders.map((o) => {
              const isSuccess = o.status === 'SUCCESS' || o.status === 'Selesai';
              const isPending = o.status === 'PENDING' || o.status === 'Menunggu';
              const dateStr = o.createdAt ? new Date(o.createdAt).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : (o.date || '-');

              return `
              <tr>
                <td><b>${o.code || '-'}</b><div style="font-size:11px;color:var(--mute)">${dateStr}</div></td>
                <td><b>${o.buyerName || o.name || '-'}</b><div style="font-size:11px;color:var(--mute)">${o.buyerPhone || o.wa || '-'}</div></td>
                <td>${o.items ? o.items.map(x => `<div>• ${x.name} (${x.label}) ×${x.qty}</div>`).join('') : `<div>• ${o.product || '-'}</div>`}</td>
                <td><b>${rp(o.price || o.total)}</b></td>
                <td><span class="badge ${isSuccess ? 'Selesai' : (isPending ? 'Menunggu' : 'Dibatalkan')}">${isSuccess ? 'LUNAS' : (isPending ? 'PENDING' : o.status)}</span></td>
                <td>
                  ${isPending ? `
                    <button class="btn ok sm" onclick="window.updateOrderStatus('${o.id}','SUCCESS')">Konfirmasi</button>
                    <button class="btn del sm" onclick="window.updateOrderStatus('${o.id}','Dibatalkan')">Tolak</button>
                  ` : `
                    <button class="btn sm" onclick="window.sendWA('${o.buyerPhone || o.wa}','${o.code}','${o.status}')">WA</button>
                    <button class="btn del sm" onclick="window.deleteOrder('${o.id}')">Hapus</button>
                  `}
                </td>
              </tr>
            `}).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

window.updateOrderStatus = async function(id, status) {
  try {
    await updateDoc(doc(db, "orders", id), { status: status });
    if (status === 'SUCCESS') {
      const order = liveOrders.find(o => o.id === id);
      if (order && order.items) {
        order.items.forEach(item => {
          (DB.products || []).forEach(p => {
            (p.variants || []).forEach(v => {
              if (v.id === item.vid || (p.name === item.name && v.label === item.label)) {
                v.stock = Math.max(0, (v.stock || 0) - item.qty);
              }
            });
          });
        });
        saveToStorage();
      }
    }
    showToast('Status pesanan diperbarui!');
  } catch(e) { alert('Gagal: ' + e.message); }
};

window.deleteOrder = async function(id) {
  if (confirm('Hapus pesanan ini?')) {
    try {
      await deleteDoc(doc(db, "orders", id));
      showToast('Pesanan dihapus.');
    } catch(e) { alert('Gagal: ' + e.message); }
  }
};

window.sendWA = function(wa, code, status) {
  if (!wa) return alert('Nomor WA kosong.');
  const fWa = wa.replace(/\D/g, '');
  const text = `Halo, pesanan *${code}* statusnya saat ini: *${status === 'SUCCESS' ? 'LUNAS' : status}*. Terima kasih di Calaye Store!`;
  window.open(`https://wa.me/${fWa}?text=` + encodeURIComponent(text), '_blank');
};

/* --- TAB 2: PRODUK & GAMBAR (STOK GAMPANG) --- */
function renderProducts(el) {
  el.innerHTML = `
    <div class="row" style="margin-bottom:14px;">
      <h3>Manajemen Produk, Gambar & Stok</h3>
      <button class="btn" onclick="window.addNewProduct()">+ Tambah Produk</button>
    </div>
    ${(DB.products || []).map((p, pi) => `
      <div class="card ${(p.variants || []).some(v => (v.stock || 0) < 3) ? 'low-stock' : ''}">
        <div class="row" style="margin-bottom:12px; gap:8px;">
          <img src="${p.img || 'https://via.placeholder.com/45'}" class="prod-img-preview" alt="Foto">
          <input style="flex:2; min-width:140px;" placeholder="Nama Produk" value="${esc(p.name)}" onchange="window.updProd(${pi},'name',this.value)">
          <input style="flex:1; min-width:100px;" placeholder="Kategori" value="${esc(p.cat)}" onchange="window.updProd(${pi},'cat',this.value)">
          <button class="btn del sm" onclick="window.delProd('${p.id}')">Hapus Produk</button>
        </div>
        <div style="margin-bottom:10px;">
          <input style="width:100%; font-size:12px;" placeholder="Link URL Gambar / Foto (contoh: https://i.imgur.com/xxx.png)" value="${esc(p.img || '')}" onchange="window.updProd(${pi},'img',this.value)">
        </div>
        
        <div style="font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px">Varian, Harga Jual, Modal & Sisa Stok:</div>
        ${(p.variants || []).map((v, vi) => `
          <div class="row" style="margin-bottom:6px; background:var(--bg); padding:8px; border-radius:12px;">
            <input style="flex:2; min-width:110px;" placeholder="Nama Varian (misal: 1 Bulan)" value="${esc(v.label)}" onchange="window.updVar('${p.id}','${v.id}','label',this.value)">
            <input style="flex:1; min-width:90px;" type="number" placeholder="Harga Jual" value="${v.price}" onchange="window.updVar('${p.id}','${v.id}','price',+this.value)">
            <input style="flex:1; min-width:90px;" type="number" placeholder="Modal" value="${v.cost || 0}" onchange="window.updVar('${p.id}','${v.id}','cost',+this.value)">
            <input style="flex:1; min-width:70px;" type="number" placeholder="Stok" value="${v.stock}" onchange="window.updVar('${p.id}','${v.id}','stock',+this.value)">
            <button class="btn del sm" onclick="window.delVar('${p.id}','${v.id}')">✕</button>
          </div>
        `).join('')}
        <button class="btn sm sp" onclick="window.addVar('${p.id}')">+ Tambah Varian</button>
      </div>
    `).join('')}`;
}

const esc = s => String(s || '').replace(/"/g, '&quot;');
window.updProd = (pi, field, val) => { DB.products[pi][field] = val; save(); };
window.updVar = (pid, vid, field, val) => {
  const p = DB.products.find(x => x.id === pid);
  if(p) { const v = p.variants.find(x => x.id === vid); if(v) { v[field] = val; save(); } }
};
window.addNewProduct = () => {
  loadDB();
  DB.products.unshift({
    id: 'p' + Math.random().toString(36).slice(2, 7),
    name: 'Produk Baru', cat: 'Lainnya', img: '', status: 'tersedia',
    variants: [{ id: 'v' + Math.random().toString(36).slice(2, 7), label: '1 Bulan', price: 15000, cost: 5000, stock: 10 }]
  });
  save();
};
window.delProd = (id) => { if(confirm('Hapus produk ini?')) { DB.products = DB.products.filter(p => p.id !== id); save(); } };
window.addVar = (pid) => {
  const p = DB.products.find(x => x.id === pid);
  if(p) { p.variants.push({ id: 'v' + Math.random().toString(36).slice(2, 7), label: 'Varian Baru', price: 10000, cost: 3000, stock: 5 }); save(); }
};
window.delVar = (pid, vid) => {
  const p = DB.products.find(x => x.id === pid);
  if(p) { p.variants = p.variants.filter(v => v.id !== vid); save(); }
};

/* --- TAB 3: KELOLA KUPON --- */
function renderCoupons(el) {
  el.innerHTML = `
    <div class="card">
      <div class="row">
        <h3>Kode Kupon Diskon</h3>
        <button class="btn sm" onclick="window.addCoupon()">+ Buat Kupon</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Kode</th>
              <th>Tipe</th>
              <th>Potongan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${(DB.coupons || []).map((c, i) => `
              <tr>
                <td><b><input value="${c.code}" onchange="DB.coupons[${i}].code=this.value.toUpperCase();save()"></b></td>
                <td>
                  <select onchange="DB.coupons[${i}].type=this.value;save()">
                    <option value="percent" ${c.type==='percent'?'selected':''}>Persen (%)</option>
                    <option value="fixed" ${c.type==='fixed'?'selected':''}>Nominal (Rp)</option>
                  </select>
                </td>
                <td><input type="number" value="${c.val}" onchange="DB.coupons[${i}].val=+this.value;save()"></td>
                <td><button class="btn del sm" onclick="DB.coupons.splice(${i},1);save()">Hapus</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}
window.addCoupon = () => { DB.coupons.push({ code: 'PROMO', type: 'percent', val: 10 }); save(); };

/* --- TAB 4: PENGATURAN --- */
function renderSettings(el) {
  el.innerHTML = `
    <div class="card" style="max-width:500px">
      <h3>Pengaturan Toko</h3>
      <label style="font-size:12px;color:var(--mute)">Nama Toko</label>
      <input class="sp" id="s-name" value="${DB.settings.name}" style="width:100%">
      
      <label style="font-size:12px;color:var(--mute);display:block;margin-top:10px">Nomor WhatsApp Admin (628...)</label>
      <input class="sp" id="s-wa" value="${DB.settings.wa}" style="width:100%">
      
      <button class="btn ok sp" style="width:100%" onclick="window.saveSet()">Simpan Pengaturan</button>
    </div>`;
}
window.saveSet = () => {
  loadDB();
  DB.settings.name = document.getElementById('s-name').value.trim();
  DB.settings.wa = document.getElementById('s-wa').value.replace(/\D/g, '');
  save();
  showToast('Pengaturan disimpan!');
};

/* --- BACKUP & RESTORE JSON --- */
window.exportData = () => {
  loadDB();
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DB, null, 2));
  const dl = document.createElement('a');
  dl.setAttribute("href", dataStr);
  dl.setAttribute("download", "calayestore_backup.json");
  document.body.appendChild(dl);
  dl.click();
  dl.remove();
};

window.importData = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (parsed && parsed.products) {
        DB = parsed;
        saveToStorage();
        updateStats();
        renderTab();
        showToast('Restore data berhasil!');
      } else { alert('Format JSON salah.'); }
    } catch(err) { alert('Gagal baca file.'); }
  };
  reader.readAsText(file);
};

updateStats();
renderTab();
</script>
</body>
</html>
