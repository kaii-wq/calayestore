<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Dashboard Pro - Calaye Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f9; --card:#ffffff; --ink:#1e293b; --mute:#64748b;
  --acc:#8b5cf6; --acc-glow:rgba(139,92,246,0.2); --line:#e2e8f0;
  --ok:#10b981; --bad:#ef4444; --warn:#f59e0b;
  --shadow:0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
}
*{box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:20px;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:16px 24px;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:20px}
h1{margin:0;font-size:20px;font-weight:800;color:var(--acc)}
h1 small{display:block;font-size:12px;color:var(--mute);font-weight:500}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:768px){.grid-4{grid-template-columns:repeat(2,1fr)}}

.stat-card{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:18px;box-shadow:var(--shadow)}
.stat-card .val{font-size:22px;font-weight:800;margin-top:6px;color:var(--ink)}
.stat-card .val.ok{color:var(--ok)}

.nav-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mute);transition:all .2s}
.tab-btn.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 14px var(--acc-glow)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

button,input,select{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.btn{background:var(--acc);color:#fff;border:none;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn.del{background:rgba(239,68,68,0.1);color:var(--bad)}
.btn.del:hover{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn)}

.badge{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge.PENDING,.badge.Menunggu{background:rgba(245,158,11,0.15);color:var(--warn)}
.badge.SUCCESS,.badge.Selesai{background:rgba(16,185,129,0.15);color:var(--ok)}
.badge.Dibatalkan{background:rgba(239,68,68,0.15);color:var(--bad)}

.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--bg);color:var(--mute);font-size:12px;text-transform:uppercase}

.toast{
  position:fixed;top:20px;right:20px;background:#1e293b;color:#fff;
  padding:14px 20px;border-radius:16px;font-size:13px;font-weight:600;z-index:999;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:slideIn .3s ease;
}
@keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>👑 Calaye Admin Pro Dashboard</h1>
      <small id="syncStatus">🟢 Terhubung ke Firebase Cloud (Real-time)</small>
    </div>
    <div class="row">
      <button class="btn sm warn" onclick="testBeep()">🔔 Tes Suara Beep</button>
    </div>
  </header>

  <!-- Financial Statistics -->
  <div class="grid-4">
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Total Omset (Lunas)</div>
      <div class="val ok" id="st-rev">Rp0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Pesanan Masuk</div>
      <div class="val" id="st-orders" style="color:var(--acc)">0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Menunggu Konfirmasi</div>
      <div class="val" id="st-pending" style="color:var(--warn)">0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Status Koneksi</div>
      <div class="val ok" style="font-size:16px;margin-top:10px">REALTIME</div>
    </div>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn on" onclick="setTab('orders',this)">📑 Kelola Pesanan Live</button>
  </div>

  <main id="app"></main>
</div>
<div id="toast-container"></div>

<!-- Firebase SDK via CDN -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Config Firebase milik pengguna
  const firebaseConfig = {
    apiKey: "AIzaSyAk3iZuyjIrexLN1UQ-HMW2CuwoOG2Ivhw",
    authDomain: "calayestore.firebaseapp.com",
    projectId: "calayestore",
    storageBucket: "calayestore.appspot.com",
    messagingSenderId: "1053043880481",
    appId: "1:1053043880481:web:bb5886b0ac92ec5338e960"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentOrders = [];
  let knownOrderIds = new Set();
  let isFirstLoad = true;

  function rp(n) { return 'Rp' + Number(n || 0).toLocaleString('id-ID'); }

  function showToast(msg) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const div = document.createElement('div');
    div.className = 'toast';
    div.textContent = msg;
    container.appendChild(div);
    setTimeout(() => div.remove(), 4000);
  }

  // Notifikasi Suara Beep Otomatis (Web Audio API)
  window.playNotificationSound = function() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime); // 880Hz
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    } catch(e) {
      console.log('Audio error:', e);
    }
  };

  window.testBeep = function() {
    window.playNotificationSound();
    showToast('🔔 Suara notifikasi aktif!');
  };

  // Listen Real-time Firestore
  onSnapshot(collection(db, "orders"), (snapshot) => {
    let orders = [];
    let hasNew = false;

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      orders.push({ id, ...data });

      if (!knownOrderIds.has(id)) {
        knownOrderIds.add(id);
        if (!isFirstLoad) {
          hasNew = true;
        }
      }
    });

    if (hasNew) {
      window.playNotificationSound();
      showToast('🔔 Ada pesanan baru masuk dari pembeli!');
    }
    isFirstLoad = false;

    // Urutkan pesanan terbaru di paling atas
    orders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    currentOrders = orders;

    updateStats();
    renderOrders();
  });

  function updateStats() {
    const completed = currentOrders.filter(o => o.status === 'SUCCESS' || o.status === 'Selesai');
    const rev = completed.reduce((a, b) => a + (b.price || b.total || 0), 0);
    const pending = currentOrders.filter(o => o.status === 'PENDING' || o.status === 'Menunggu').length;

    document.getElementById('st-rev').textContent = rp(rev);
    document.getElementById('st-orders').textContent = currentOrders.length;
    document.getElementById('st-pending').textContent = pending;
  }

  function renderOrders() {
    const app = document.getElementById('app');
    if (!app) return;

    if (!currentOrders.length) {
      app.innerHTML = `<div class="card" style="text-align:center; color:var(--mute);">Belum ada pesanan masuk di Cloud Firebase.</div>`;
      return;
    }

    app.innerHTML = `
      <div class="card">
        <h3>Daftar Pesanan Live (Firebase)</h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Waktu</th>
                <th>Pemesan</th>
                <th>Detail Produk & Varian</th>
                <th>Total</th>
                <th>Status</th>
                <th>Aksi Admin</th>
              </tr>
            </thead>
            <tbody>
              ${currentOrders.map((o) => {
                const isPending = o.status === 'PENDING' || o.status === 'Menunggu';
                const isSuccess = o.status === 'SUCCESS' || o.status === 'Selesai';
                const dateStr = o.createdAt ? new Date(o.createdAt).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) : '-';

                return `
                <tr>
                  <td><b>${dateStr}</b></td>
                  <td><b>${o.buyerName || o.name || '-'}</b><div style="font-size:11px;color:var(--mute)">${o.buyerPhone || o.wa || '-'}</div></td>
                  <td><b>${o.product || '-'}</b><div style="font-size:11px;color:var(--mute)">Varian: ${o.variant || o.label || '-'}</div></td>
                  <td><b>${rp(o.price || o.total)}</b></td>
                  <td><span class="badge ${isSuccess ? 'Selesai' : (isPending ? 'Menunggu' : 'Dibatalkan')}">${isSuccess ? 'LUNAS' : (isPending ? 'PENDING' : o.status)}</span></td>
                  <td>
                    ${isPending ? `
                      <button class="btn ok sm" onclick="window.confirmOrder('${o.id}')">Konfirmasi (Sudah Bayar)</button>
                      <button class="btn del sm" onclick="window.cancelOrder('${o.id}')">Tolak</button>
                    ` : `
                      <button class="btn sm" onclick="window.sendWA('${o.buyerPhone || o.wa}','${o.product}','${o.status}')">Balas WA</button>
                      <button class="btn del sm" onclick="window.deleteOrder('${o.id}')">Hapus</button>
                    `}
                  </td>
                </tr>
              `}).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  // Fungsi Aksi Admin (Update Firestore)
  window.confirmOrder = async function(id) {
    try {
      await updateDoc(doc(db, "orders", id), { status: 'SUCCESS' });
      showToast('Pesanan berhasil dikonfirmasi (Lunas)!');
    } catch(e) { alert('Gagal update: ' + e.message); }
  };

  window.cancelOrder = async function(id) {
    try {
      await updateDoc(doc(db, "orders", id), { status: 'Dibatalkan' });
      showToast('Pesanan dibatalkan.');
    } catch(e) { alert('Gagal update: ' + e.message); }
  };

  window.deleteOrder = async function(id) {
    if (confirm('Hapus riwayat pesanan ini dari Firebase?')) {
      try {
        await deleteDoc(doc(db, "orders", id));
        showToast('Pesanan dihapus dari Cloud.');
      } catch(e) { alert('Gagal hapus: ' + e.message); }
    }
  };

  window.sendWA = function(wa, prod, status) {
    if(!wa) return alert('Nomor WA tidak tersedia.');
    const formattedWa = wa.replace(/\D/g, '');
    const text = `Halo, pesanan produk *${prod}* Anda saat ini statusnya: *${status === 'SUCCESS' ? 'SELESAI / LUNAS' : status}*. Terima kasih telah berbelanja di Calaye Store!`;
    window.open(`https://wa.me/${formattedWa}?text=` + encodeURIComponent(text), '_blank');
  };
</script>
</body>
</html>
