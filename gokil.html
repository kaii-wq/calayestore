<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Dashboard Pro - Calaye Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f5fc; --card:#ffffff; --ink:#2b1c38; --mute:#867597;
  --acc:#8b5cf6; --acc-glow:rgba(139,92,246,0.2); --line:#ebdcf5;
  --ok:#10b981; --bad:#ef4444; --warn:#f59e0b;
  --shadow:0 10px 30px rgba(139, 92, 246, 0.08);
}
*{box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:20px;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto}

header{
  display:flex;justify-content:space-between;align-items:center;background:var(--card);
  padding:18px 24px;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:20px;
}
h1{margin:0;font-size:20px;font-weight:800;color:var(--acc)}
h1 small{display:block;font-size:12px;color:var(--mute);font-weight:500}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:768px){.grid-4{grid-template-columns:repeat(2,1fr)}}

.stat-card{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:18px;box-shadow:var(--shadow);transition:transform .2s;}
.stat-card:hover{transform:translateY(-2px);}
.stat-card .val{font-size:24px;font-weight:800;margin-top:6px;color:var(--ink)}
.stat-card .val.ok{color:var(--ok)}

.nav-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mute);transition:all .2s}
.tab-btn.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 14px var(--acc-glow)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

button,input,select,textarea{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);outline:none;background:var(--card);color:var(--ink);}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.btn{background:var(--acc);color:#fff;border:none;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn.del{background:rgba(239,68,68,0.1);color:var(--bad)}
.btn.del:hover{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn)}

.badge{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge.PENDING,.badge.Menunggu,.badge.Diproses{background:rgba(245,158,11,0.15);color:var(--warn)}
.badge.SUCCESS,.badge.Selesai{background:rgba(16,185,129,0.15);color:var(--ok)}
.badge.Dibatalkan{background:rgba(239,68,68,0.15);color:var(--bad)}

.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--bg);color:var(--mute);font-size:12px;text-transform:uppercase}

.toast{
  position:fixed;top:20px;right:20px;background:#2b1c38;color:#fff;
  padding:14px 20px;border-radius:16px;font-size:13px;font-weight:600;z-index:999;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:slideIn .3s ease;
}
@keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

.sp{margin-top:14px}
.low-stock{background:rgba(239,68,68,0.03);border-left:4px solid var(--bad)}
.prod-img-preview{width:45px;height:45px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fff}
.chart-container{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>👑 Calaye Admin Pro</h1>
      <small>🟢 Real-Time Cloud Sync Active</small>
    </div>
    <div class="row">
      <button class="btn warn sm" onclick="window.testBeep()">🔔 Tes Beep</button>
      <button class="btn ok sm" onclick="window.exportData()">📥 Backup JSON</button>
    </div>
  </header>

  <!-- Statistik Finansial -->
  <div class="grid-4">
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Total Omset Lunas</div>
      <div class="val ok" id="st-rev">Rp0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Estimasi Profit Bersih</div>
      <div class="val" id="st-profit" style="color:var(--acc)">Rp0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Total Pesanan</div>
      <div class="val" id="st-orders">0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Klaim Garansi Masuk</div>
      <div class="val" id="st-warranty" style="color:var(--warn)">0</div>
    </div>
  </div>

  <!-- Grafik Batang Penjualan -->
  <div class="chart-container">
    <div class="row" style="margin-bottom:10px;">
      <h3 style="margin:0; font-size:15px;">📊 Grafik Omset 7 Hari Terakhir</h3>
      <span style="font-size:12px; color:var(--mute);">Cloud Live Chart</span>
    </div>
    <canvas id="salesChart" height="90" style="width:100%;"></canvas>
  </div>

  <!-- Tab Navigasi -->
  <div class="nav-tabs">
    <button class="tab-btn on" onclick="window.setTab('orders',this)">📑 Pesanan Live</button>
    <button class="tab-btn" onclick="window.setTab('warranty',this)">🛡️ Rekapan Garansi</button>
    <button class="tab-btn" onclick="window.setTab('products',this)">📦 Produk & Deskripsi</button>
    <button class="tab-btn" onclick="window.setTab('coupons',this)">🎟️ Kupon Diskon</button>
    <button class="tab-btn" onclick="window.setTab('announcement',this)">📢 Pengumuman Banner</button>
    <button class="tab-btn" onclick="window.setTab('settings',this)">⚙️ Pengaturan Toko</button>
  </div>

  <main id="app"></main>
</div>
<div id="toast-container"></div>

<!-- Firebase & Script Logika Admin -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAk3iZuyjIrexLN1UQ-HMW2CuwoOG2Ivhw",
  authDomain: "calayestore.firebaseapp.com",
  projectId: "calayestore",
  storageBucket: "calayestore.appspot.com",
  messagingSenderId: "1053043880481",
  appId: "1:1053043880481:web:bb5886b0ac92ec5338e960"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const seedData = {
  settings: { name: 'Calaye Store', wa: '6281234567890' },
  announcement: { text: '✨ Selamat datang di Calaye Store! Nikmati layanan instan & bergaransi.', active: true },
  coupons: [
    { code: 'CALAYE20', type: 'percent', val: 10 },
    { code: 'HEMAT5K', type: 'fixed', val: 5000 }
  ],
  products: [
    {
      id: 'p1', name: 'Canva Pro', cat: 'Desain', img: '', desc: 'Akun Canva Pro resmi bergaransi full 1 bulan.', status: 'tersedia',
      variants: [
        { id: 'v1', label: '1 Bulan', price: 10000, cost: 4000, stock: 10 },
        { id: 'v2', label: '1 Tahun', price: 60000, cost: 20000, stock: 4 }
      ]
    }
  ]
};

let DB = JSON.parse(JSON.stringify(seedData));
let currentTab = 'orders';
let liveOrders = [];
let liveWarranties = [];
let knownOrderIds = new Set();
let isFirstLoad = true;
let isSyncing = false;
let orderSearchQuery = '';
let warrantySearchQuery = '';

// Sinkronisasi Data Konfigurasi Toko
onSnapshot(doc(db, "store", "config"), (docSnap) => {
  if (isSyncing) return;
  if (docSnap.exists()) {
    const data = docSnap.data();
    if (data.products) DB.products = data.products;
    if (data.coupons) DB.coupons = data.coupons;
    if (data.settings) DB.settings = data.settings;
    if (data.announcement) DB.announcement = data.announcement;
    updateStats();
    renderTab();
  } else {
    setDoc(doc(db, "store", "config"), seedData);
  }
});

async function saveToCloud() {
  try {
    isSyncing = true;
    await setDoc(doc(db, "store", "config"), {
      products: DB.products,
      coupons: DB.coupons,
      settings: DB.settings,
      announcement: DB.announcement
    });
    setTimeout(() => { isSyncing = false; }, 500);
  } catch(e) {
    isSyncing = false;
    console.error("Gagal simpan ke cloud:", e);
  }
}

function save() {
  saveToCloud();
  updateStats();
  renderTab();
}

function rp(n) { return 'Rp' + Number(n || 0).toLocaleString('id-ID'); }

function showToast(msg) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'toast';
  div.textContent = msg;
  container.appendChild(div);
  setTimeout(() => div.remove(), 4000);
}

window.playNotificationSound = function() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
};

window.testBeep = function() {
  window.playNotificationSound();
  showToast('🔔 Suara beep aktif!');
};

// Realtime Listener Pesanan Masuk
onSnapshot(collection(db, "orders"), (snapshot) => {
  let orders = [];
  let newOrderDetected = false;

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const id = docSnap.id;
    orders.push({ id, ...data });

    if (!knownOrderIds.has(id)) {
      knownOrderIds.add(id);
      if (!isFirstLoad) newOrderDetected = true;
    }
  });

  if (newOrderDetected) {
    window.playNotificationSound();
    showToast('🔔 Ada pesanan baru masuk!');
  }
  isFirstLoad = false;

  orders.sort((a, b) => new Date(b.createdAt || b.date || 0) - new Date(a.createdAt || a.date || 0));
  liveOrders = orders;

  updateStats();
  renderTab();
});

// Realtime Listener Klaim Garansi
onSnapshot(collection(db, "warranties"), (snapshot) => {
  let warrants = [];
  snapshot.forEach((docSnap) => {
    warrants.push({ id: docSnap.id, ...docSnap.data() });
  });
  warrants.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  liveWarranties = warrants;
  updateStats();
  if (currentTab === 'warranty') renderTab();
});

function updateStats() {
  const completed = liveOrders.filter(o => o.status === 'SUCCESS' || o.status === 'Selesai');
  const rev = completed.reduce((a, b) => a + (b.price || b.total || 0), 0);
  
  let profit = 0;
  completed.forEach(o => {
    (o.items || []).forEach(item => {
      const prod = (DB.products || []).find(p => p.id === item.pid || p.name === item.name);
      if (prod && prod.variants) {
        const v = prod.variants.find(x => x.label === item.label || x.id === item.vid);
        if (v && v.cost !== undefined) {
          profit += ((item.price || v.price) - v.cost) * (item.qty || 1);
        } else {
          profit += (item.price || 0) * 0.4 * (item.qty || 1);
        }
      }
    });
  });

  if (document.getElementById('st-rev')) document.getElementById('st-rev').textContent = rp(rev);
  if (document.getElementById('st-profit')) document.getElementById('st-profit').textContent = rp(profit);
  if (document.getElementById('st-orders')) document.getElementById('st-orders').textContent = liveOrders.length;
  if (document.getElementById('st-warranty')) document.getElementById('st-warranty').textContent = liveWarranties.length;

  drawChart(completed);
}

function drawChart(completedOrders) {
  const canvas = document.getElementById('salesChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const days = [];
  const mapData = {};
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().split('T')[0];
    const label = d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
    days.push({ key, label });
    mapData[key] = 0;
  }

  completedOrders.forEach(o => {
    if (o.createdAt) {
      const k = o.createdAt.split('T')[0];
      if (mapData[k] !== undefined) {
        mapData[k] += (o.price || o.total || 0);
      }
    }
  });

  const values = days.map(d => mapData[d.key]);
  const maxVal = Math.max(...values, 100000);

  const w = canvas.width = canvas.parentElement.clientWidth - 40;
  const h = canvas.height = 140;
  ctx.clearRect(0, 0, w, h);
  const barWidth = (w / days.length) - 12;

  days.forEach((d, i) => {
    const val = mapData[d.key];
    const barH = (val / maxVal) * (h - 35);
    const x = i * (barWidth + 12) + 10;
    const y = h - barH - 20;

    ctx.fillStyle = '#8b5cf6';
    if (typeof ctx.roundRect === 'function') {
      ctx.beginPath();
      ctx.roundRect(x, y, barWidth, barH, [6, 6, 0, 0]);
      ctx.fill();
    } else {
      ctx.fillRect(x, y, barWidth, barH);
    }

    ctx.fillStyle = '#867597';
    ctx.font = '10px "Plus Jakarta Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.label, x + barWidth / 2, h - 5);
  });
}

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  if (el) el.classList.add('on');
  renderTab();
}

function renderTab() {
  const app = document.getElementById('app');
  if (!app) return;
  if (currentTab === 'orders') renderOrders(app);
  else if (currentTab === 'warranty') renderWarranty(app);
  else if (currentTab === 'products') renderProducts(app);
  else if (currentTab === 'coupons') renderCoupons(app);
  else if (currentTab === 'announcement') renderAnnouncement(app);
  else if (currentTab === 'settings') renderSettings(app);
}

function renderOrders(el) {
  const filteredOrders = liveOrders.filter(o => 
    (o.code || '').toLowerCase().includes(orderSearchQuery.toLowerCase()) || 
    (o.buyerName || o.name || '').toLowerCase().includes(orderSearchQuery.toLowerCase())
  );

  el.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:12px;">
        <h3>Daftar Pesanan Masuk (${liveOrders.length})</h3>
        <div class="row" style="gap:8px;">
          <button class="btn ok sm" onclick="window.exportToSpreadsheet('orders')">📊 Export Spreadsheet</button>
          <input type="text" placeholder="🔍 Cari kode / nama..." value="${esc(orderSearchQuery)}" oninput="window.setOrderSearch(this.value)" style="max-width:220px;">
        </div>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Kode / Waktu</th>
              <th>Pemesan</th>
              <th>Produk</th>
              <th>Total</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${filteredOrders.length ? filteredOrders.map((o) => {
              const isSuccess = o.status === 'SUCCESS' || o.status === 'Selesai';
              const isPending = o.status === 'PENDING' || o.status === 'Menunggu';
              const dateStr = o.createdAt ? new Date(o.createdAt).toLocaleDateString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : (o.date || '-');

              return `
              <tr>
                <td><b>${o.code || '-'}</b><div style="font-size:11px;color:var(--mute)">${dateStr}</div></td>
                <td><b>${o.buyerName || o.name || '-'}</b><div style="font-size:11px;color:var(--mute)">${o.buyerPhone || o.wa || '-'}</div></td>
                <td>${o.items ? o.items.map(x => `<div>• ${x.name} (${x.label}) ×${x.qty}</div>`).join('') : `<div>• ${o.product || '-'}</div>`}</td>
                <td><b>${rp(o.price || o.total)}</b></td>
                <td><span class="badge ${isSuccess ? 'Selesai' : (isPending ? 'Menunggu' : 'Dibatalkan')}">${isSuccess ? 'LUNAS' : (isPending ? 'PENDING' : o.status)}</span></td>
                <td>
                  ${isPending ? `
                    <button class="btn ok sm" onclick="window.updateOrderStatus('${o.id}','SUCCESS')">Konfirmasi</button>
                    <button class="btn del sm" onclick="window.updateOrderStatus('${o.id}','Dibatalkan')">Tolak</button>
                  ` : `
                    <button class="btn sm" onclick="window.sendWA('${o.buyerPhone || o.wa}','${o.code}','${o.status}')">WA</button>
                    <button class="btn del sm" onclick="window.deleteOrder('${o.id}')">Hapus</button>
                  `}
                </td>
              </tr>`;
            }).join('') : `<tr><td colspan="6" style="text-align:center;color:var(--mute);padding:24px;">Tidak ada pesanan ditemukan.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
}

window.setOrderSearch = (q) => {
  orderSearchQuery = q;
  renderOrders(document.getElementById('app'));
};

window.updateOrderStatus = async function(id, status) {
  try {
    await updateDoc(doc(db, "orders", id), { status: status });
    if (status === 'SUCCESS') {
      const order = liveOrders.find(o => o.id === id);
      if (order && order.items) {
        order.items.forEach(item => {
          (DB.products || []).forEach(p => {
            (p.variants || []).forEach(v => {
              if (v.id === item.vid || (p.name === item.name && v.label === item.label)) {
                v.stock = Math.max(0, (v.stock || 0) - item.qty);
              }
            });
          });
        });
        save();
      }
    }
    showToast('Status pesanan berhasil diperbarui!');
  } catch(e) { alert('Gagal: ' + e.message); }
};

window.deleteOrder = async function(id) {
  if (confirm('Hapus riwayat pesanan ini?')) {
    try {
      await deleteDoc(doc(db, "orders", id));
      showToast('Pesanan berhasil dihapus.');
    } catch(e) { alert('Gagal: ' + e.message); }
  }
};

window.sendWA = function(wa, code, status) {
  if (!wa) return alert('Nomor WA kosong.');
  const fWa = wa.replace(/\D/g, '');
  const text = `Halo, pesanan *${code}* statusnya saat ini: *${status === 'SUCCESS' ? 'LUNAS' : status}*. Terima kasih di ${DB.settings.name}!`;
  window.open(`https://wa.me/${fWa}?text=` + encodeURIComponent(text), '_blank');
};

/* --- TAB BARU: REKAPAN GARANSI --- */
function renderWarranty(el) {
  const filteredWarranties = liveWarranties.filter(w => 
    (w.code || '').toLowerCase().includes(warrantySearchQuery.toLowerCase()) || 
    (w.customerName || '').toLowerCase().includes(warrantySearchQuery.toLowerCase()) ||
    (w.accountDetail || '').toLowerCase().includes(warrantySearchQuery.toLowerCase())
  );

  el.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:12px;">
        <h3>🛡️ Rekapan Klaim Garansi Customer (${liveWarranties.length})</h3>
        <div class="row" style="gap:8px;">
          <button class="btn ok sm" onclick="window.exportToSpreadsheet('warranty')">📊 Export Spreadsheet</button>
          <button class="btn sm" onclick="window.openAddWarrantyModal()">+ Catat Manual Klaim</button>
          <input type="text" placeholder="🔍 Cari kode / nama / akun..." value="${esc(warrantySearchQuery)}" oninput="window.setWarrantySearch(this.value)" style="max-width:220px;">
        </div>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Tgl Beli & Masalah</th>
              <th>Kode / Customer</th>
              <th>Detail Akun Bermasalah</th>
              <th>No WhatsApp</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${filteredWarranties.length ? filteredWarranties.map((w) => {
              const isDone = w.status === 'Selesai';
              const buyDate = w.buyDate || '-';
              const probDate = w.problemDate || (w.createdAt ? new Date(w.createdAt).toLocaleDateString('id-ID') : '-');

              return `
              <tr>
                <td>
                  <div style="font-size:11px;color:var(--mute)">Beli: ${buyDate}</div>
                  <div style="font-size:11px;color:var(--bad)">Lapor: ${probDate}</div>
                </td>
                <td><b>${w.code || '-'}</b><div style="font-size:12px; font-weight:700;">${w.customerName || '-'}</div></td>
                <td><code>${w.accountDetail || '-'}</code></td>
                <td><a href="https://wa.me/${(w.customerPhone || '').replace(/\D/g, '')}" target="_blank" style="color:var(--acc); text-decoration:none; font-weight:750;">${w.customerPhone || '-'}</a></td>
                <td><span class="badge ${isDone ? 'Selesai' : 'Diproses'}">${w.status || 'Diproses'}</span></td>
                <td>
                  ${!isDone ? `
                    <button class="btn ok sm" onclick="window.updateWarrantyStatus('${w.id}', 'Selesai')">Selesaikan</button>
                  ` : `
                    <button class="btn warn sm" onclick="window.updateWarrantyStatus('${w.id}', 'Diproses')">Proses Ulang</button>
                  `}
                  <button class="btn del sm" onclick="window.deleteWarranty('${w.id}')">Hapus</button>
                </td>
              </tr>`;
            }).join('') : `<tr><td colspan="6" style="text-align:center;color:var(--mute);padding:24px;">Belum ada rekapan garansi yang tercatat.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
}

window.setWarrantySearch = (q) => {
  warrantySearchQuery = q;
  renderWarranty(document.getElementById('app'));
};

window.updateWarrantyStatus = async function(id, status) {
  try {
    await updateDoc(doc(db, "warranties", id), { status: status });
    showToast('Status garansi diperbarui!');
  } catch(e) { alert('Gagal: ' + e.message); }
};

window.deleteWarranty = async function(id) {
  if (confirm('Hapus data rekapan garansi ini?')) {
    try {
      await deleteDoc(doc(db, "warranties", id));
      showToast('Data garansi dihapus.');
    } catch(e) { alert('Gagal: ' + e.message); }
  }
};

window.openAddWarrantyModal = async function() {
  const code = prompt("Masukkan Kode Pemesanan / Invoice:");
  if (!code) return;
  const customerName = prompt("Nama Customer:");
  const customerPhone = prompt("Nomor WhatsApp Customer (cth: 08123...):");
  const buyDate = prompt("Tanggal Pembelian (cth: 01 Nov 2026):");
  const accountDetail = prompt("Detail Akun Bermasalah (Email / Username / Keterangan):");
  
  if (!customerName || !accountDetail) return alert("Nama dan Detail akun wajib diisi!");

  try {
    await addDoc(collection(db, "warranties"), {
      code,
      customerName,
      customerPhone: customerPhone || '-',
      buyDate: buyDate || '-',
      problemDate: new Date().toLocaleDateString('id-ID'),
      accountDetail,
      status: 'Diproses',
      createdAt: new Date().toISOString()
    });
    showToast('Klaim garansi berhasil dicatat!');
  } catch(e) {
    alert('Gagal mencatat: ' + e.message);
  }
};

/* --- FITUR EKSPOR KE GOOGLE SPREADSHEET (CSV/TSV Clipboard) --- */
window.exportToSpreadsheet = function(type) {
  let header = "";
  let rows = [];

  if (type === 'orders') {
    header = "Kode Pesanan\tTanggal\tNama Pemesan\tNo WhatsApp\tProduk\tTotal Bayar\tStatus\n";
    rows = liveOrders.map(o => {
      const prods = (o.items || []).map(x => `${x.name} (${x.label}) x${x.qty}`).join(', ') || o.product || '-';
      const dateStr = o.createdAt ? new Date(o.createdAt).toLocaleString('id-ID') : (o.date || '-');
      return `${o.code || '-'}\t${dateStr}\t${o.buyerName || o.name || '-'}\t${o.buyerPhone || o.wa || '-'}\t"${prods}"\t${o.price || o.total || 0}\t${o.status || '-'}`;
    });
  } else if (type === 'warranty') {
    header = "Tanggal Beli\tTanggal Bermasalah\tKode Pesanan\tNama Customer\tNo WhatsApp\tDetail Akun\tStatus\n";
    rows = liveWarranties.map(w => {
      return `${w.buyDate || '-'}\t${w.problemDate || '-'}\t${w.code || '-'}\t${w.customerName || '-'}\t${w.customerPhone || '-'}\t"${w.accountDetail || '-'}"\t${w.status || '-'}`;
    });
  }

  const tsvContent = header + rows.join('\n');
  
  // Salin otomatis ke clipboard agar bisa langsung di-Paste (Ctrl+V) ke Google Sheets / Excel
  navigator.clipboard.writeText(tsvContent).then(() => {
    showToast('📊 Berhasil disalin! Buka Google Spreadsheet, klik cell A1, lalu tekan Ctrl+V.');
  }).catch(err => {
    // Fallback download file CSV jika clipboard diblokir browser
    const blob = new Blob([tsvContent], { type: 'text/tab-separated-values;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `calayestore_${type}_export.tsv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    showToast('File Spreadsheet berhasil diunduh!');
  });
};

            <input style="flex:1; min-width:70px;" type="number" placeholder="Stok" value="${v.stock}" onchange="window.updVar('${p.id}','${v.id}','stock',+this.value)">

const esc = s => String(s || '').replace(/"/g, '&quot;');

window.setTab = setTab;
window.updProd = (pi, field, val) => { DB.products[pi][field] = val; save(); };
window.updVar = (pid, vid, field, val) => {
  const p = DB.products.find(x => x.id === pid);
  if(p) { const v = p.variants.find(x => x.id === vid); if(v) { v[field] = val; save(); } }
};
window.addNewProduct = () => {
  DB.products.unshift({
    id: 'p' + Math.random().toString(36).slice(2, 7),
    name: 'Produk Baru', cat: 'Lainnya', img: '', desc: 'Akun premium garansi resmi.', status: 'tersedia',
    variants: [{ id: 'v' + Math.random().toString(36).slice(2, 7), label: '1 Bulan', price: 15000, cost: 5000, stock: 10 }]
  });
  save();
};
window.delProd = (id) => { if(confirm('Hapus produk ini?')) { DB.products = DB.products.filter(p => p.id !== id); save(); } };
window.addVar = (pid) => {
  const p = DB.products.find(x => x.id === pid);
  if(p) { p.variants.push({ id: 'v' + Math.random().toString(36).slice(2, 7), label: 'Varian Baru', price: 10000, cost: 3000, stock: 5 }); save(); }
};
window.delVar = (pid, vid) => {
  const p = DB.products.find(x => x.id === pid);
  if(p) { p.variants = p.variants.filter(v => v.id !== vid); save(); }
};
