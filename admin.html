<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Dashboard Pro - Calaye Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f9; --card:#ffffff; --ink:#1e293b; --mute:#64748b;
  --acc:#8b5cf6; --acc-glow:rgba(139,92,246,0.2); --line:#e2e8f0;
  --ok:#10b981; --bad:#ef4444; --warn:#f59e0b;
  --shadow:0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
}
*{box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:20px;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:16px 24px;border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:20px}
h1{margin:0;font-size:20px;font-weight:800;color:var(--acc)}
h1 small{display:block;font-size:12px;color:var(--mute);font-weight:500}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:768px){.grid-4{grid-template-columns:repeat(2,1fr)}}

.stat-card{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:18px;box-shadow:var(--shadow)}
.stat-card .val{font-size:22px;font-weight:800;margin-top:6px;color:var(--ink)}
.stat-card .val.ok{color:var(--ok)}

.nav-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mute);transition:all .2s}
.tab-btn.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 14px var(--acc-glow)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

button,input,select{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.btn{background:var(--acc);color:#fff;border:none;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn.del{background:rgba(239,68,68,0.1);color:var(--bad)}
.btn.del:hover{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn)}

.badge{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge.Menunggu{background:rgba(245,158,11,0.15);color:var(--warn)}
.badge.Selesai{background:rgba(16,185,129,0.15);color:var(--ok)}
.badge.Dibatalkan{background:rgba(239,68,68,0.15);color:var(--bad)}

.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--bg);color:var(--mute);font-size:12px;text-transform:uppercase}

.toast{
  position:fixed;top:20px;right:20px;background:#1e293b;color:#fff;
  padding:14px 20px;border-radius:16px;font-size:13px;font-weight:600;z-index:999;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:slideIn .3s ease;
}
@keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

.sp{margin-top:14px}
.low-stock{background:rgba(239,68,68,0.03);border-left:4px solid var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>👑 Calaye Admin Pro Dashboard</h1>
      <small>Live Auto-Refresh & Notifikasi Aktif</small>
    </div>
    <div class="row">
      <button class="btn ok sm" onclick="exportData()">📥 Backup Data (JSON)</button>
      <button class="btn sm" onclick="document.getElementById('impFile').click()">📤 Restore Data</button>
      <input type="file" id="impFile" style="display:none" accept=".json" onchange="importData(event)">
    </div>
  </header>

  <!-- Financial Statistics -->
  <div class="grid-4">
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Total Omset (Selesai)</div>
      <div class="val ok" id="st-rev">Rp0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Estimasi Keuntungan</div>
      <div class="val" id="st-profit" style="color:var(--acc)">Rp0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Total Pesanan</div>
      <div class="val" id="st-orders">0</div>
    </div>
    <div class="stat-card">
      <div style="color:var(--mute);font-size:12px">Stok Perlu Diisi (<3)</div>
      <div class="val" id="st-low" style="color:var(--bad)">0 Item</div>
    </div>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn on" onclick="setTab('orders',this)">📑 Kelola Pesanan</button>
    <button class="tab-btn" onclick="setTab('products',this)">📦 Stok & Produk</button>
    <button class="tab-btn" onclick="setTab('coupons',this)">🎟️ Kode Kupon</button>
    <button class="tab-btn" onclick="setTab('settings',this)">⚙️ Pengaturan Toko</button>
  </div>

  <main id="app"></main>
</div>
<div id="toast-container"></div>

<script>
const DB_KEY = 'calaye_store_db_v5';
const seedData = () => ({
  settings: { name: 'Calaye Store', wa: '6281234567890', pin: '1234' },
  coupons: [
    { code: 'CALAYE20', type: 'percent', val: 10 },
    { code: 'HEMAT5K', type: 'fixed', val: 5000 }
  ],
  orders: [],
  products: [
    {
      id: 'p1', name: 'Canva Pro', cat: 'Desain', status: 'tersedia',
      variants: [
        { id: 'v1', label: '1 Bulan', price: 10000, cost: 4000, stock: 10 },
        { id: 'v2', label: '1 Tahun', price: 60000, cost: 20000, stock: 4 }
      ]
    },
    {
      id: 'p2', name: 'Netflix Premium', cat: 'Streaming', status: 'tersedia',
      variants: [
        { id: 'v3', label: '1 Bulan', price: 25000, cost: 15000, stock: 2 }
      ]
    }
  ]
});

let DB;
function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) DB = JSON.parse(raw);
  } catch(e) {}
  if (!DB || !Array.isArray(DB.products)) {
    DB = seedData();
    saveToStorage();
  }
}
loadDB();

let currentTab = 'orders';
let lastOrderCount = DB.orders ? DB.orders.length : 0;

function saveToStorage() {
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}

function save() {
  saveToStorage();
  updateStats();
  renderTab();
}

function rp(n) { return 'Rp' + Number(n || 0).toLocaleString('id-ID'); }

function showToast(msg) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'toast';
  div.textContent = msg;
  container.appendChild(div);
  setTimeout(() => div.remove(), 4000);
}

// Suara Notifikasi Beep Otomatis menggunakan Web Audio API
function playNotificationSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Nada D5
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

// Background Polling / Auto-Refresh latar belakang setiap 3 detik
setInterval(() => {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const newOrders = parsed.orders || [];
      if (newOrders.length > lastOrderCount) {
        showToast('🔔 Pesanan baru masuk! Silakan cek tab Pesanan.');
        playNotificationSound();
        DB = parsed;
        updateStats();
        if (currentTab === 'orders') renderOrders(document.getElementById('app'));
      }
      lastOrderCount = newOrders.length;
    }
  } catch(e) {}
}, 3000);

function updateStats() {
  loadDB();
  const completed = (DB.orders || []).filter(o => o.status === 'Selesai');
  const rev = completed.reduce((a, b) => a + b.total, 0);
  
  let profit = 0;
  completed.forEach(o => {
    (o.items || []).forEach(item => {
      const prod = (DB.products || []).find(p => p.id === item.pid || p.name === item.name);
      if (prod && prod.variants) {
        const v = prod.variants.find(x => x.label === item.label || x.id === item.vid);
        if (v && v.cost !== undefined) {
          profit += (item.price - v.cost) * item.qty;
        } else {
          profit += item.price * 0.5 * item.qty;
        }
      }
    });
  });

  let lowStockCount = 0;
  (DB.products || []).forEach(p => {
    (p.variants || []).forEach(v => { if ((v.stock || 0) < 3) lowStockCount++; });
  });

  const stRev = document.getElementById('st-rev');
  const stProfit = document.getElementById('st-profit');
  const stOrders = document.getElementById('st-orders');
  const stLow = document.getElementById('st-low');

  if (stRev) stRev.textContent = rp(rev);
  if (stProfit) stProfit.textContent = rp(profit);
  if (stOrders) stOrders.textContent = (DB.orders || []).length;
  if (stLow) stLow.textContent = lowStockCount + ' Item';
}

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  if (el) el.classList.add('on');
  renderTab();
}

function renderTab() {
  loadDB();
  const app = document.getElementById('app');
  if (!app) return;
  if (currentTab === 'orders') renderOrders(app);
  else if (currentTab === 'products') renderProducts(app);
  else if (currentTab === 'coupons') renderCoupons(app);
  else if (currentTab === 'settings') renderSettings(app);
}

/* --- TAB 1: KELOLA PESANAN --- */
function renderOrders(el) {
  const orders = DB.orders || [];
  if (!orders.length) {
    el.innerHTML = `<div class="card" style="text-align:center; color:var(--mute);">Belum ada pesanan masuk.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="card">
      <h3>Daftar Pesanan Masuk</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Kode / Tanggal</th>
              <th>Pemesan</th>
              <th>Detail Produk</th>
              <th>Total</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${orders.map((o, i) => `
              <tr>
                <td><b>${o.code}</b><div style="font-size:11px;color:var(--mute)">${o.date}</div></td>
                <td><b>${o.name}</b><div style="font-size:11px;color:var(--mute)">${o.wa}</div></td>
                <td>${(o.items || []).map(x => `<div>• ${x.name} (${x.label}) ×${x.qty}</div>`).join('')}</td>
                <td><b>${rp(o.total)}</b></td>
                <td><span class="badge ${o.status}">${o.status}</span></td>
                <td>
                  ${o.status === 'Menunggu' ? `
                    <button class="btn ok sm" onclick="updateOrderStatus(${i},'Selesai')">Konfirmasi (Sudah Bayar)</button>
                    <button class="btn del sm" onclick="updateOrderStatus(${i},'Dibatalkan')">Tolak</button>
                  ` : `
                    <button class="btn sm" onclick="sendWhatsAppReply('${o.wa}','${o.code}','${o.status}')">Balas WA</button>
                  `}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function updateOrderStatus(idx, status) {
  loadDB();
  const o = DB.orders[idx];
  if (!o) return;
  if (status === 'Selesai') {
    (o.items || []).forEach(item => {
      (DB.products || []).forEach(p => {
        (p.variants || []).forEach(v => {
          if (v.id === item.vid || (p.name === item.name && v.label === item.label)) {
            v.stock = Math.max(0, v.stock - item.qty);
          }
        });
      });
    });
  }
  o.status = status;
  save();
  showToast('Status pesanan diperbarui menjadi: ' + status);
}

function sendWhatsAppReply(wa, code, status) {
  const text = `Halo, mengenai pesanan Anda dengan kode *${code}*, status saat ini: *${status}*. Terima kasih telah berbelanja di ${DB.settings.name}!`;
  window.open(`https://wa.me/${wa}?text=` + encodeURIComponent(text), '_blank');
}

/* --- TAB 2: KELOLA PRODUK & STOK --- */
function renderProducts(el) {
  el.innerHTML = `
    <div class="row" style="margin-bottom:14px;">
      <h3>Daftar Produk & Varian Harga</h3>
      <button class="btn" onclick="addNewProduct()">+ Tambah Produk Baru</button>
    </div>
    ${(DB.products || []).map((p, pi) => `
      <div class="card ${(p.variants || []).some(v => (v.stock || 0) < 3) ? 'low-stock' : ''}">
        <div class="row" style="margin-bottom:10px;">
          <div class="row" style="gap:10px; flex:1;">
            <input style="flex:2;" value="${p.name}" onchange="DB.products[${pi}].name=this.value;save()">
            <input style="flex:1;" value="${p.cat}" onchange="DB.products[${pi}].cat=this.value;save()">
          </div>
          <button class="btn del sm" onclick="deleteProduct('${p.id}')">Hapus Produk</button>
        </div>
        
        <div style="font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px">Varian Paket, Harga, Modal & Stok:</div>
        ${(p.variants || []).map((v, vi) => `
          <div class="row" style="margin-bottom:6px; background:var(--bg); padding:8px; border-radius:12px;">
            <input style="flex:2;" placeholder="Nama Paket" value="${v.label}" onchange="DB.products[${pi}].variants[${vi}].label=this.value;save()">
            <input style="flex:1;" type="number" placeholder="Harga Jual" value="${v.price}" onchange="DB.products[${pi}].variants[${vi}].price=+this.value;save()">
            <input style="flex:1;" type="number" placeholder="Modal" value="${v.cost || 0}" onchange="DB.products[${pi}].variants[${vi}].cost=+this.value;save()">
            <input style="flex:1; width:70px;" type="number" placeholder="Stok" value="${v.stock}" onchange="DB.products[${pi}].variants[${vi}].stock=+this.value;save()">
            <button class="btn del sm" onclick="deleteVariant('${p.id}','${v.id}')">✕</button>
          </div>
        `).join('')}
        <button class="btn sm sp" onclick="addVariant('${p.id}')">+ Tambah Varian Paket</button>
      </div>
    `).join('')}`;
}

function addNewProduct() {
  loadDB();
  DB.products.unshift({
    id: 'p' + Math.random().toString(36).slice(2, 7),
    name: 'Aplikasi Baru', cat: 'Lainnya', status: 'tersedia',
    variants: [{ id: 'v' + Math.random().toString(36).slice(2, 7), label: '1 Bulan', price: 15000, cost: 5000, stock: 10 }]
  });
  save();
}

function deleteProduct(id) {
  if (confirm('Hapus produk ini beserta variannya?')) {
    loadDB();
    DB.products = DB.products.filter(p => p.id !== id);
    save();
  }
}

function addVariant(pid) {
  loadDB();
  const p = DB.products.find(x => x.id === pid);
  if (p) {
    p.variants.push({ id: 'v' + Math.random().toString(36).slice(2, 7), label: 'Paket Baru', price: 10000, cost: 3000, stock: 5 });
    save();
  }
}

function deleteVariant(pid, vid) {
  loadDB();
  const p = DB.products.find(x => x.id === pid);
  if (p) {
    p.variants = p.variants.filter(v => v.id !== vid);
    save();
  }
}

/* --- TAB 3: KELOLA KUPON --- */
function renderCoupons(el) {
  el.innerHTML = `
    <div class="card">
      <div class="row">
        <h3>Kode Kupon Diskon</h3>
        <button class="btn sm" onclick="addCoupon()">+ Buat Kupon Baru</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Kode Kupon</th>
              <th>Tipe Diskon</th>
              <th>Nilai Potongan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${(DB.coupons || []).map((c, i) => `
              <tr>
                <td><b><input value="${c.code}" onchange="DB.coupons[${i}].code=this.value.toUpperCase();save()"></b></td>
                <td>
                  <select onchange="DB.coupons[${i}].type=this.value;save()">
                    <option value="percent" ${c.type === 'percent' ? 'selected' : ''}>Persen (%)</option>
                    <option value="fixed" ${c.type === 'fixed' ? 'selected' : ''}>Nominal (Rp)</option>
                  </select>
                </td>
                <td><input type="number" value="${c.val}" onchange="DB.coupons[${i}].val=+this.value;save()"></td>
                <td><button class="btn del sm" onclick="DB.coupons.splice(${i},1);save()">Hapus</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function addCoupon() {
  loadDB();
  DB.coupons.push({ code: 'DISKONBARU', type: 'percent', val: 10 });
  save();
}

/* --- TAB 4: PENGATURAN TOKO --- */
function renderSettings(el) {
  el.innerHTML = `
    <div class="card" style="max-width:500px">
      <h3>⚙️ Pengaturan Umum Toko</h3>
      <label style="font-size:12px;color:var(--mute)">Nama Toko</label>
      <input class="sp" id="s-name" value="${DB.settings.name}" style="width:100%">
      
      <label style="font-size:12px;color:var(--mute);display:block;margin-top:10px">Nomor WhatsApp Tujuan (Format: 628...)</label>
      <input class="sp" id="s-wa" value="${DB.settings.wa}" style="width:100%">
      
      <button class="btn ok sp" style="width:100%" onclick="saveSettingsForm()">Simpan Pengaturan</button>
    </div>`;
}

function saveSettingsForm() {
  loadDB();
  DB.settings.name = document.getElementById('s-name').value.trim();
  DB.settings.wa = document.getElementById('s-wa').value.replace(/\D/g, '');
  save();
  showToast('Pengaturan berhasil disimpan!');
}

/* --- BACKUP & RESTORE JSON --- */
function exportData() {
  loadDB();
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(DB, null, 2));
  const dl = document.createElement('a');
  dl.setAttribute("href", dataStr);
  dl.setAttribute("download", "calaye_store_backup.json");
  document.body.appendChild(dl);
  dl.click();
  dl.remove();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (parsed && parsed.products) {
        DB = parsed;
        saveToStorage();
        updateStats();
        renderTab();
        showToast('Data toko berhasil dipulihkan (Restore)!');
      } else {
        alert('File JSON tidak valid!');
      }
    } catch (err) {
      alert('Gagal membaca file JSON!');
    }
  };
  reader.readAsText(file);
}

// Inisialisasi Awal
updateStats();
renderTab();
</script>
</body>
</html>
