<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calaye Store - Premium Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Pustaka QRCode.js untuk memastikan barcode pasti tampil -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  --font:"Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --bg1:#f8f5fc;
  --card:#ffffff;
  --card-border:rgba(139, 92, 246, 0.12);
  --ink:#2b1c38;
  --mute:#867597;
  --acc:#8b5cf6;
  --acc-glow:rgba(139, 92, 246, 0.25);
  --grad-btn:linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
  --line:#ebdcf5;
  --ok:#10b981;
  --bad:#ef4444;
  --shadow:0 10px 30px rgba(139, 92, 246, 0.08);
}
*{box-sizing:border-box}
body{
  margin:0; font-family:var(--font); color:var(--ink); background:var(--bg1);
  min-height:100vh; padding-bottom: 90px;
}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;
  padding:14px 20px;background:var(--card);
  border:1px solid var(--card-border);border-radius:20px;box-shadow:var(--shadow);
}
h1{font-size:18px;margin:0;font-weight:800;color:var(--acc)}
nav{display:flex;gap:6px;align-items:center}
button,input,select{font:inherit;color:inherit}
.btn{
  border:1px solid var(--line);background:#fff;padding:8px 16px;
  border-radius:99px;cursor:pointer;font-weight:600;font-size:12px;color:var(--ink);transition:all .2s;
}
.btn.on,.btn.pri{background:var(--grad-btn);color:#fff;border:none;box-shadow:0 4px 15px var(--acc-glow)}
.btn.sm{padding:6px 12px;font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:20px;padding:16px;box-shadow:var(--shadow);
}
.card h3{margin:0 0 2px;font-size:15px;font-weight:700}
.mute{color:var(--mute);font-size:12px}
.vs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.v{
  border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:transparent;
  cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;
}
.v.on{background:var(--acc);color:#fff;border-color:transparent}
.v:disabled{opacity:.4;cursor:not-allowed}
.price{font-size:16px;font-weight:800;color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
input,select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.ok{background:rgba(16,185,129,0.15);color:var(--ok)}
.bad{background:rgba(239,68,68,0.15);color:var(--bad)}

.toast{
  position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:99px;font-size:12px;font-weight:600;z-index:99;box-shadow:0 5px 20px rgba(0,0,0,0.2);
}
.qris-box{text-align:center;background:#fff;padding:16px;border-radius:16px;border:1px solid var(--line);margin-top:12px;}
.qris-render{display:flex;justify-content:center;margin:10px auto;}
.success-icon{font-size:54px;margin-bottom:8px;}

/* Floating Cart Bubble di Bawah */
.cart-bubble{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:99px;
  display:flex; align-items:center; justify-content:space-between; gap:24px;
  width:90%; max-width:500px; box-shadow:0 10px 25px rgba(0,0,0,0.2);
  z-index:98; cursor:pointer; font-weight:700; font-size:13px;
  animation: slideUp .3s ease;
}
@keyframes slideUp{from{transform:translate(-50%, 50px);opacity:0}to{transform:translate(-50%, 0);opacity:1}}

.announcement-banner{
  background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
  color: #fff; padding: 12px 18px; border-radius: 16px; font-size: 13px; font-weight: 600;
  margin-bottom: 16px; box-shadow: 0 4px 15px var(--acc-glow); display: flex; align-items: center; gap: 10px;
}
.sp{margin-top:12px}
.prod-img{width:100%;height:130px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#eee;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 id="sn">Calaye Store</h1>
  </div>
  <nav id="nav"></nav>
</header>

<!-- Banner Pengumuman dari Admin -->
<div id="banner-container"></div>

<main id="app"></main>
</div>
<div id="toast"></div>

<!-- Floating Bubble Keranjang di Bawah -->
<div id="floating-cart"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAk3iZuyjIrexLN1UQ-HMW2CuwoOG2Ivhw",
  authDomain: "calayestore.firebaseapp.com",
  projectId: "calayestore",
  storageBucket: "calayestore.appspot.com",
  messagingSenderId: "1053043880481",
  appId: "1:1053043880481:web:bb5886b0ac92ec5338e960"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const BASE_QRIS = "00020101021126570011ID.DANA.WWW011893600915395683928802099568392880303UMI51440014ID.CO.QRIS.WWW0215ID10254193879030303UMI5204581353033605802ID5913Calaye Store 6015Kota Yogyakarta6105552726304B6D6";

function convertQRISDynamic(qris, amount) {
  let base = qris.slice(0, -4);
  base = base.replace("010211", "010212");
  const amtStr = amount.toString();
  const amtTag = "54" + amtStr.length.toString().padStart(2, "0") + amtStr;
  const idx58 = base.indexOf("5802ID");
  if (idx58 !== -1) base = base.slice(0, idx58) + amtTag + base.slice(idx58);
  else base = base + amtTag;
  
  let crc = 0xFFFF;
  for (let i = 0; i < base.length; i++) {
    crc ^= base.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
      else crc = crc << 1;
    }
  }
  return base + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, "0");
}

let DB = {
  settings: { name: 'Calaye Store', wa: '6281234567890' },
  announcement: { text: '', active: false },
  coupons: [],
  products: []
};

let view = 'shop', cat = 'Semua', searchQuery = '', cart = {}, sel = {}, last = null, coupon = '';
let unsubscribeOrderStatus = null;

const $ = id => document.getElementById(id);
const rp = n => 'Rp' + Number(n || 0).toLocaleString('id-ID');
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cartN = () => Object.values(cart).reduce((a, b) => a + b, 0);
const nm = () => (DB.settings && DB.settings.name) ? DB.settings.name : 'Calaye Store';

function toast(m) {
  const t = $('toast');
  if (t) {
    t.innerHTML = `<div class="toast">${esc(m)}</div>`;
    setTimeout(() => t.innerHTML = '', 2200);
  }
}

// Sinkronisasi data real-time dari Firebase
onSnapshot(doc(db, "store", "config"), (docSnap) => {
  if (docSnap.exists()) {
    DB = docSnap.data();
    render();
  }
});

function go(v) { 
  if (v !== 'cart' && unsubscribeOrderStatus) unsubscribeOrderStatus();
  view = v; last = null; render(); 
}
window.go = go;

function render() {
  document.title = nm();
  if ($('sn')) $('sn').textContent = nm();
  
  // Render Banner Pengumuman
  const bannerEl = $('banner-container');
  if (DB.announcement && DB.announcement.active && DB.announcement.text) {
    bannerEl.innerHTML = `<div class="announcement-banner">📢 <span>${esc(DB.announcement.text)}</span></div>`;
  } else {
    bannerEl.innerHTML = '';
  }

  if ($('nav')) {
    $('nav').innerHTML = `
      <button class="btn sm ${view === 'shop' ? 'on' : ''}" onclick="window.go('shop')">Katalog</button>
      <button class="btn sm ${view === 'cart' ? 'on' : ''}" onclick="window.go('cart')">Keranjang${cartN() ? ' (' + cartN() + ')' : ''}</button>
    `;
  }
  
  const app = $('app');
  if (app) {
    app.innerHTML = view === 'shop' ? shop() : cartV();
    if (view === 'cart' && !last && Object.keys(cart).length > 0) {
      renderQRCode();
    }
  }

  renderFloatingCart();
}

function renderQRCode() {
  const qrisContainer = $('qris-qrcode-box');
  if (!qrisContainer) return;
  qrisContainer.innerHTML = ''; // Kosongkan dulu
  
  let subtotal = 0;
  Object.keys(cart).forEach(i => { const f = findVar(i); if (f) subtotal += f.v.price * cart[i]; });
  let discount = 0;
  const coupons = DB.coupons || [];
  const cObj = coupons.find(x => (x.code || '').toUpperCase() === coupon.trim().toUpperCase());
  if (cObj) discount = cObj.type === 'percent' ? subtotal * (cObj.val / 100) : cObj.val;
  const total = Math.max(0, subtotal - discount);
  const dynamicQrisStr = total > 0 ? convertQRISDynamic(BASE_QRIS, total) : BASE_QRIS;

  // Render QR Code secara lokal menggunakan qrcode.js
  new QRCode(qrisContainer, {
    text: dynamicQrisStr,
    width: 220,
    height: 220,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
}

function renderFloatingCart() {
  const floating = $('floating-cart');
  const count = cartN();
  if (count > 0 && view === 'shop') {
    let subtotal = 0;
    Object.keys(cart).forEach(i => { const f = findVar(i); if(f) subtotal += f.v.price * cart[i]; });
    
    floating.innerHTML = `
      <div class="cart-bubble" onclick="window.go('cart')">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="background:#fff; color:var(--ink); padding:4px 10px; border-radius:99px; font-size:12px;">🛒 ${count} Item</span>
          <span>Buka Keranjang</span>
        </div>
        <span>${rp(subtotal)} →</span>
      </div>`;
  } else {
    floating.innerHTML = '';
  }
}

function shop() {
  const cats = ['Semua', ...new Set((DB.products || []).map(p => p.cat || 'Lainnya'))];
  const list = (DB.products || []).filter(p => (cat === 'Semua' || p.cat === cat) && (p.name || '').toLowerCase().includes(searchQuery.toLowerCase()));

  return `
    <div style="margin-bottom:12px;">
      <input type="text" placeholder="🔍 Cari aplikasi premium..." value="${esc(searchQuery)}" oninput="window.setSearch(this.value)">
    </div>
    <div class="chips">
      ${cats.map(c => `<button class="btn sm ${c === cat ? 'on' : ''}" onclick="window.setCat('${esc(c)}')">${esc(c)}</button>`).join('')}
    </div>
    <div class="grid">
      ${list.length ? list.map(p => {
        const variants = p.variants || [];
        const off = p.status !== 'tersedia' || variants.every(v => (v.stock || 0) < 1);
        const cur = variants.find(v => v.id === sel[p.id]) || variants.find(v => (v.stock || 0) > 0) || variants[0];
        
        return `
          <div class="card">
            ${p.img ? `<img src="${esc(p.img)}" class="prod-img" alt="${esc(p.name)}">` : ''}
            <div class="row">
              <h3>${esc(p.name)}</h3>
              <span class="badge ${off ? 'bad' : 'ok'}">${off ? 'Habis' : 'Tersedia'}</span>
            </div>
            <div class="mute">${esc(p.cat)}</div>
            <div class="vs">
              ${variants.map(v => `<button class="v ${cur && v.id === cur.id ? 'on' : ''}" ${(v.stock || 0) < 1 ? 'disabled' : ''} onclick="window.setSel('${p.id}','${v.id}')">${esc(v.label)}</button>`).join('')}
            </div>
            ${cur ? `
              <div class="row" style="margin-top:8px;">
                <div>
                  <div class="price">${rp(cur.price)}</div>
                  <div class="mute">Stok: ${cur.stock || 0}</div>
                </div>
                <button class="btn pri sm" ${off || (cur.stock || 0) < 1 ? 'disabled' : ''} onclick="window.add('${cur.id}')">+ Keranjang</button>
              </div>
            ` : ''}
          </div>`;
      }).join('') : '<div class="card" style="grid-column:span 2;text-align:center;color:var(--mute)">Produk tidak ditemukan</div>'}
    </div>`;
}

function findVar(vid) {
  for (const p of (DB.products || [])) {
    if (p.variants) {
      const v = p.variants.find(x => x.id === vid);
      if (v) return { p, v };
    }
  }
  return null;
}

function add(id) {
  const f = findVar(id);
  if (!f) return;
  if ((cart[id] || 0) >= f.v.stock) { toast('Stok tidak cukup!'); return; }
  cart[id] = (cart[id] || 0) + 1;
  toast(f.p.name + ' ditambahkan 🛒');
  render();
}

function qty(id, d) {
  const f = findVar(id);
  if (!f) { delete cart[id]; render(); return; }
  const n = (cart[id] || 0) + d;
  if (n <= 0) delete cart[id];
  else if (n > f.v.stock) { toast('Stok tidak cukup!'); return; }
  else cart[id] = n;
  render();
}

function cartV() {
  if (last) {
    const isSuccess = last.status === 'SUCCESS' || last.status === 'Selesai';
    return `
      <div class="card" style="text-align:center;padding:32px 20px">
        ${isSuccess ? `
          <div class="success-icon">🎉</div>
          <h2 style="color:var(--ok); margin-bottom:6px">Pembayaran Berhasil!</h2>
          <p class="mute">Pesanan Anda telah dikonfirmasi oleh Admin.</p>
          <div style="background:rgba(16,185,129,0.08); border:1px solid var(--ok); padding:14px; border-radius:14px; margin:16px 0;">
            <b>Kode Order: ${last.code}</b><br>
            <span class="badge ok" style="margin-top:6px; display:inline-block;">STATUS: LUNAS</span>
          </div>
        ` : `
          <div class="success-icon">⏳</div>
          <h3 style="color:var(--acc); margin-bottom:4px">Menunggu Konfirmasi Admin</h3>
          <p class="mute">Silakan kirim bukti pembayaran QRIS ke WhatsApp admin.</p>
          <div style="background:#f8f5fc; border:1px solid var(--line); padding:14px; border-radius:14px; margin:16px 0;">
            <b>Kode Order: ${last.code}</b><br>
            <span class="badge bad" style="margin-top:6px; display:inline-block;">STATUS: MENUNGGU PEMBAYARAN</span>
          </div>
        `}
        
        <a class="btn pri" style="display:block;text-decoration:none;text-align:center;padding:12px;margin-top:12px;" href="${last.url}" target="_blank" rel="noopener">Kirim Bukti ke WhatsApp 🚀</a>
        <div style="margin-top:16px"><button class="btn sm" onclick="window.go('shop')">← Kembali ke Katalog</button></div>
      </div>`;
  }

  const ids = Object.keys(cart);
  if (!ids.length) return '<div class="card" style="text-align:center;padding:40px"><p class="mute">Keranjang belanjaan kamu masih kosong.</p><button class="btn pri sm sp" onclick="window.go(\'shop\')">Lihat Katalog</button></div>';

  let subtotal = 0;
  ids.forEach(i => { const f = findVar(i); if (f) subtotal += f.v.price * cart[i]; });

  let discount = 0, discName = '';
  const coupons = DB.coupons || [];
  const cObj = coupons.find(x => (x.code || '').toUpperCase() === coupon.trim().toUpperCase());
  if (cObj) {
    discount = cObj.type === 'percent' ? subtotal * (cObj.val / 100) : cObj.val;
    discName = `Diskon (${cObj.code})`;
  }
  const total = Math.max(0, subtotal - discount);

  return `
    <div class="card">
      <h3>Keranjang Belanja 🛒</h3>
      ${ids.map(i => {
        const f = findVar(i);
        if (!f) return '';
        return `
          <div class="row sp" style="border-bottom:1px solid var(--line); padding-bottom:8px;">
            <div>
              <b>${esc(f.p.name)}</b>
              <div class="mute">${esc(f.v.label)} · ${rp(f.v.price)}</div>
            </div>
            <div class="row">
              <button class="btn sm" onclick="window.qty('${i}',-1)">−</button>
              <b style="min-width:20px;text-align:center">${cart[i]}</b>
              <button class="btn sm" onclick="window.qty('${i}',1)">+</button>
            </div>
          </div>`;
      }).join('')}
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <div class="row"><span class="mute">Subtotal</span><span>${rp(subtotal)}</span></div>
      ${discount > 0 ? `<div class="row mute" style="color:var(--ok)"><span>${discName}</span><span>-${rp(discount)}</span></div>` : ''}
      <div class="row sp" style="font-size:16px;"><b>Total Bayar</b><span class="price">${rp(total)}</span></div>

      <div class="sp row" style="gap:6px">
        <input style="flex:1" placeholder="Kode Kupon (Opsional)" value="${esc(coupon)}" oninput="window.setCoupon(this.value)">
        <button class="btn sm" onclick="window.render()">Pakai</button>
      </div>

      <div class="sp"><input id="cn" placeholder="Nama Lengkap Anda"></div>
      <div class="sp"><input id="cw" inputmode="tel" placeholder="Nomor WhatsApp (Contoh: 08123456789)"></div>
      
      <!-- Kotak Barcode QRIS Lokal (Pasti Tampil & Dinamis) -->
      <div class="qris-box">
        <b style="font-size:14px; color:var(--acc);">Scan Barcode QRIS Otomatis</b>
        <div style="font-size:18px; font-weight:800; color:var(--ok); margin-top:4px;">${rp(total)}</div>
        <div id="qris-qrcode-box" class="qris-render"></div>
        <div style="font-size:11px; color:var(--mute); margin-top:6px;">Mendukung DANA, GoPay, OVO, ShopeePay, & m-Banking.</div>
      </div>

      <button class="btn pri sp" style="width:100%; padding: 14px;" onclick="window.checkout()">Konfirmasi Pesanan & Bayar 🚀</button>
    </div>`;
}

function startRealtimeOrder(docId) {
  if (unsubscribeOrderStatus) unsubscribeOrderStatus();
  unsubscribeOrderStatus = onSnapshot(doc(db, "orders", docId), (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.data();
      if (data.status === 'SUCCESS' || data.status === 'Selesai') {
        if (last) last.status = 'SUCCESS';
        render();
      }
    }
  });
}

async function checkout() {
  const name = $('cn').value.trim();
  const wa = $('cw').value.replace(/\D/g, '');

  if (!name || wa.length < 9) { toast('Lengkapi Nama dan Nomor WhatsApp!'); return; }
  
  const ids = Object.keys(cart);
  const d = new Date();
  const code = 'CS-' + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  
  const items = ids.map(i => {
    const f = findVar(i);
    return { vid: f.v.id, name: f.p.name, label: f.v.label, price: f.v.price, qty: cart[i] };
  });
  
  const subtotal = items.reduce((a, b) => a + b.price * b.qty, 0);
  let discount = 0;
  const coupons = DB.coupons || [];
  const cObj = coupons.find(x => (x.code || '').toUpperCase() === coupon.trim().toUpperCase());
  if (cObj) discount = cObj.type === 'percent' ? subtotal * (cObj.val / 100) : cObj.val;
  const total = Math.max(0, subtotal - discount);

  const targetWA = (DB.settings && DB.settings.wa) ? DB.settings.wa : '6281234567890';
  const text = `Halo ${nm()}, saya ingin memesan:\n\nKode Order: *${code}*\nNama: ${name}\nWA: ${wa}\n\nRincian Pesanan:\n` + items.map((x, n) => `${n + 1}. ${x.name} (${x.label}) x${x.qty} = ${rp(x.price * x.qty)}`).join('\n') + `\n\n*Total Bayar: ${rp(total)}*\nMetode: *QRIS Barcode*\n\n(Berikut saya lampirkan bukti pembayaran). Terima kasih!`;
  const url = 'https://wa.me/' + targetWA + '?text=' + encodeURIComponent(text);

  try {
    const orderData = {
      code,
      name,
      buyerName: name,
      wa,
      buyerPhone: wa,
      items,
      product: items.map(x => `${x.name} (${x.label})`).join(', '),
      variant: items.map(x => x.label).join(', '),
      total,
      price: total,
      status: 'PENDING',
      date: d.toLocaleString('id-ID'),
      createdAt: d.toISOString()
    };

    const docRef = await addDoc(collection(db, "orders"), orderData);
    
    cart = {}; coupon = ''; 
    last = { code, url, status: 'PENDING', docId: docRef.id }; 
    render(); 
    startRealtimeOrder(docRef.id); 
    window.open(url, '_blank');

  } catch (err) {
    alert('Gagal mengirim pesanan: ' + err.message);
  }
}

window.add = add;
window.qty = qty;
window.checkout = checkout;
window.render = render;
window.setCat = (c) => { cat = c; render(); };
window.setSel = (pid, vid) => { sel[pid] = vid; render(); };
window.setSearch = (val) => { searchQuery = val; render(); };
window.setCoupon = (val) => { coupon = val; };

render();
</script>
</body>
</html>
